name: build-ipa

on:
  workflow_dispatch:
    inputs:
      framework_run_id:
        description: NodeMobile 框架构建所在的 run id
        required: true
      bundle_asset_id:
        description: bundle.zip 的 release asset id
        required: true

permissions:
  actions: read   # 跨 run 下载 artifact
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download Node libs
        uses: actions/download-artifact@v4
        with:
          name: NodeMobile-ios-arm64
          run-id: ${{ inputs.framework_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/Frameworks

      - name: Show libs
        run: |
          ls app/Frameworks/libs | head -40
          echo "count = $(ls app/Frameworks/libs | wc -l)"
          lipo -info app/Frameworks/libs/libnode.a || true

      - name: Download runtime bundle
        run: |
          set -e
          mkdir -p app/Resources/bundle
          # bundle 放在私有仓库 hjianging/xiaobai-bundle，用 BUNDLE_TOKEN 拉取
          curl -sSL -H "Authorization: Bearer ${{ secrets.BUNDLE_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/hjianging/xiaobai-bundle/releases/assets/${{ inputs.bundle_asset_id }}" \
               -o /tmp/bundle.zip
          ls -lh /tmp/bundle.zip
          unzip -q /tmp/bundle.zip -d app/Resources/bundle
          du -sh app/Resources/bundle
          ls app/Resources/bundle

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate && cat XiaobaiCode.xcodeproj/project.pbxproj | head -20

      - name: Build (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project XiaobaiCode.xcodeproj \
            -scheme XiaobaiCode \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -80

      - name: Package ipa
        run: |
          set -e
          APP=$(find app/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          du -sh Payload
          zip -qry "xiaobai-code-${VER}-ios-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          if-no-files-found: error

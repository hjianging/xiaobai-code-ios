name: build-node-ios

on:
  workflow_dispatch:

jobs:
  framework:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Checkout nodejs-mobile (Node 22.9.0)
        run: |
          git clone --depth 1 --branch update22-9-0 https://github.com/nodejs-mobile/nodejs-mobile.git node
          cd node && git log -1 --oneline

      - name: Toolchain info
        run: |
          xcodebuild -version
          python3 --version
          sysctl -n hw.ncpu hw.memsize
          df -h /

      # macos-14 标准 runner 只有 ~14GB 盘，Node+V8 的 host/target 两套产物会撑爆，
      # 删掉用不到的平台与模拟器缓存腾地方（真机 framework 只需要 iPhoneOS + macOS SDK）。
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/iPhoneSimulator.platform" || true
          sudo rm -rf "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/WatchOS.platform" || true
          sudo rm -rf "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/WatchSimulator.platform" || true
          sudo rm -rf "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/AppleTVOS.platform" || true
          sudo rm -rf "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/AppleTVSimulator.platform" || true
          sudo rm -rf "/Library/Developer/CoreSimulator" || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator" || true
          sudo rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
          sudo rm -rf "$HOME/Library/Android" /usr/local/lib/android || true
          df -h /

      - name: Build iOS arm64 device framework
        run: bash ci/build-ios-framework.sh

      - name: Diagnose host tool
        if: failure()
        run: |
          ls -la node/out/Release/node_js2c || true
          file node/out/Release/node_js2c || true
          otool -l node/out/Release/node_js2c 2>/dev/null | grep -A5 LC_BUILD_VERSION | head -12 || true

      - name: Locate framework
        if: success()
        run: |
          ls -la node/dist/libs | head -40
          echo "count = $(ls node/dist/libs | wc -l)"
          du -sh node/dist
          lipo -info node/dist/libs/libnode.a

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NodeMobile-ios-arm64
          path: node/dist
          if-no-files-found: error

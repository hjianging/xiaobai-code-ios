name: build-node-ios

on:
  workflow_dispatch:

jobs:
  framework:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Checkout nodejs-mobile (Node 22.9.0)
        run: |
          git clone --depth 1 --branch update22-9-0 https://github.com/nodejs-mobile/nodejs-mobile.git node
          cd node && git log -1 --oneline

      - name: Toolchain info
        run: |
          xcodebuild -version
          python3 --version
          sysctl -n hw.ncpu hw.memsize
          df -h /

      - name: Build iOS arm64 device framework
        run: bash ci/build-ios-framework.sh

      - name: Diagnose host tool
        if: failure()
        run: |
          ls -la node/out/Release/node_js2c || true
          file node/out/Release/node_js2c || true
          otool -l node/out/Release/node_js2c 2>/dev/null | grep -A5 LC_BUILD_VERSION | head -12 || true

      - name: Locate framework
        if: success()
        run: |
          find node/out_ios_arm64 -maxdepth 4 -name "NodeMobile.framework" -print -exec du -sh {} \;
          ls -la node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework || true
          ls -la node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework/Headers || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NodeMobile-ios-arm64
          path: node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework
          if-no-files-found: error

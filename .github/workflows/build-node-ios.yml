name: build-node-ios

on:
  workflow_dispatch:

jobs:
  framework:
    # 上游 CI 同样指定 macos-13 + Xcode 15.2 构建 iOS 真机包；
    # arm64 宿主（macos-14）上交叉编译时宿主工具 node_js2c 会被内核 SIGKILL
    runs-on: macos-13
    timeout-minutes: 350
    env:
      XCODE_VERSION: 15.2
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /Library/Frameworks/Mono.framework || true
          sudo rm -rf /Library/Frameworks/Xamarin.iOS.framework || true
          sudo rm -rf /Library/Frameworks/Xamarin.Android.framework || true
          sudo rm -rf /Users/runner/Library/Android || true
          sudo find /Applications -type d -name "Xcode_*.app" ! -name "Xcode_15.2.app" -prune -exec rm -rf "{}" \; || true
          df -h /

      - name: Checkout nodejs-mobile (Node 22.9.0)
        run: |
          git clone --depth 1 --branch update22-9-0 https://github.com/nodejs-mobile/nodejs-mobile.git node
          cd node && git log -1 --oneline

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Toolchain info
        run: |
          xcodebuild -version
          python3 --version
          sysctl -n hw.ncpu hw.memsize

      - name: Build iOS arm64 device framework
        working-directory: node
        run: |
          # configure.py 会选 Python 3.12，而 3.12 没有 distutils（node-gyp#2869），上游用 venv + setuptools 兜住
          python3.12 -m venv . || python3 -m venv .
          source bin/activate
          python -m pip install --quiet setuptools
          ./tools/ios_framework_prepare.sh arm64

      - name: Diagnose host tool
        if: failure()
        working-directory: node
        run: |
          ls -la out/Release/node_js2c || true
          file out/Release/node_js2c || true
          codesign -dv out/Release/node_js2c || true
          out/Release/node_js2c || echo "run exit=$?"

      - name: Locate framework
        if: success()
        run: |
          find node/out_ios_arm64 -maxdepth 4 -name "NodeMobile.framework" -print -exec du -sh {} \;
          ls -la node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework || true
          ls -la node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework/Headers || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NodeMobile-ios-arm64
          path: node/out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework
          if-no-files-found: error

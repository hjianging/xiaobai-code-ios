name: XiaobaiCode

options:
  bundleIdPrefix: com.xiaobai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  XiaobaiCode:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/bundle
        type: folder
    settings:
      base:
        PRODUCT_NAME: XiaobaiCode
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobai.code
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "141"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        # Node 22.9.0 的静态库由 build-node-ios 产出，CI 里解到 Frameworks/libs
        OTHER_LDFLAGS: >-
          $(inherited) -ObjC -lc++ -lresolv
          -L$(PROJECT_DIR)/Frameworks/libs
          -lnode
          -lv8_snapshot -lv8_initializers -lv8_initializers_slow -lv8_compiler
          -lv8_base_without_compiler -lv8_turboshaft -lv8_init -lv8_abseil
          -lv8_libbase -lv8_libplatform -lv8_zlib -ltorque_base
          -lada -lbrotli -lcares -lhistogram -lllhttp -lnbytes -lncrypto
          -lnghttp2 -lnghttp3 -lngtcp2 -lopenssl -lsimdjson -lsimdutf -lsqlite
          -luv -luvwasi -lzlib -lzlib_inflate_chunk_simd
          -framework CoreFoundation
        ENABLE_BITCODE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 小白code
        CFBundleName: XiaobaiCode
        CFBundleShortVersionString: "1.4.1"
        CFBundleVersion: "141"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
